name: Sync Org Profile README

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update regardless of changes'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run generator
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN }}
        run: python scripts/generate-org-readme.py

      - name: Check for changes
        id: check
        run: |
          git diff --quiet profile/README.md || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/README.md .github/repo-state.json
          git commit -m "docs: auto-update org profile README [skip ci]" || true
          git push
